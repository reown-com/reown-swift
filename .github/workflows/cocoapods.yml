name: Cocoapods Release

on:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cocoapods-release:
    runs-on: macos-15-xlarge
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Publish to CocoaPods trunk
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          set -o pipefail
          pod trunk push reown-swift.podspec --allow-warnings 2>&1 | tee pod-trunk-push.log

      - name: Show CocoaPods errors
        if: failure()
        run: grep -nE 'ERROR \||error: |did not pass|\[!\]' pod-trunk-push.log | head -100 || true

      - name: Upload CocoaPods log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pod-trunk-push-log
          path: pod-trunk-push.log
