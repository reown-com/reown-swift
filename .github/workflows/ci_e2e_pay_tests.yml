name: Maestro E2E Pay Tests
# "(skip-metrics)" tells the E2E KPI job (WalletConnect/actions) to drop this run.
run-name: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.draft) || (github.event_name == 'workflow_dispatch' && github.ref_name != 'develop')) && format('{0} (skip-metrics)', github.event.pull_request.title || github.ref_name) || '' }}

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - develop
      - main
  schedule:
    # Run daily at 04:00 UTC (only on the default branch)
    - cron: '0 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

# A new push to a PR cancels its superseded run (freeing the test wallet);
# scheduled and dispatched runs are never cancelled by another run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-balance:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: ./.github/workflows/e2e_balance_check.yml
    secrets: inherit

  e2e-pay-tests:
    needs: check-balance
    # !cancelled() rather than always(): still runs when check-balance fails or is
    # skipped, but a cancelled run stops (GitHub leaves an `always()` job running).
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: macos-latest-xlarge
    timeout-minutes: 45
    # One test wallet for this repo (see derive-e2e-wallet): runs on other refs
    # queue instead of paying from the same account at the same time. GitHub
    # keeps one pending run per group; a newer one replaces it.
    concurrency:
      group: e2e-wallet-swift
      cancel-in-progress: false
    permissions:
      checks: write
      actions: read
    env:
      ARTIFACTS_DIR: debug-artifacts
    steps:
      - uses: actions/checkout@v4

      # This repo's account in the mnemonic shared with the other SDK repos
      # (index 4; see the action for the reserved indexes), so no other repo's
      # Permit2 reset or Polygon nonce races with this suite.
      - name: Derive E2E wallet
        id: wallet
        uses: ./.github/actions/derive-e2e-wallet
        with:
          mnemonic: ${{ secrets.TEST_WALLET_MNEMONIC }}
          index: 4
          expected-address: ${{ vars.TEST_WALLET_ADDRESS_IOS }}

      - name: Select Xcode 26 (iOS 26 SDK)
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26'

      - name: Install simslim
        env:
          # Pinned release + checksum: simslim is young and ships often.
          SIMSLIM_VERSION: '0.11.0'
          SIMSLIM_SHA256: d7ae4d0c834dfea9911f113cf60e98c25ee61f2a3a85ca22d0c28c43b39ccfaf
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/simslim"
          mkdir -p "$DIR"
          curl -fsSL --proto "=https" --proto-redir "=https" \
            --retry 5 --retry-all-errors --retry-delay 3 \
            --connect-timeout 20 --max-time 300 -o "$DIR/simslim.tar.gz" \
            "https://github.com/MobAI-App/simslim/releases/download/v${SIMSLIM_VERSION}/simslim-v${SIMSLIM_VERSION}-macos-arm64.tar.gz"
          echo "$SIMSLIM_SHA256  $DIR/simslim.tar.gz" | shasum -a 256 -c -
          tar -xzf "$DIR/simslim.tar.gz" -C "$DIR" simslim
          echo "$DIR" >> "$GITHUB_PATH"
          "$DIR/simslim" --version

      # Boot the simulators BEFORE the build (not right before `maestro test`).
      # A never-booted device posts a one-time "Ready for Apple Intelligence"
      # follow-up notification a few minutes after its first boot; when the sim
      # was booted seconds before the tests, that banner landed ~8s into the
      # first flow, covering the button Maestro was about to tap. Booting early
      # lets it fire and auto-dismiss during the build instead (the script also
      # pre-seeds the key that marks it as shown).
      # Two slim simulators (~2.3 GB each vs ~5.5 GB stock); the suite is split
      # across them. A third made every flow slower on this 5-core runner
      # (react-native-examples#638).
      - name: Boot iOS simulators
        env:
          SIMULATORS: 2
          SLIM: 'true'
          # A first boot can be slow on a loaded runner (10m default).
          SIMSLIM_BOOT_TIMEOUT: 15m
        run: bash .github/scripts/maestro/boot-simulators.sh

      # Packages are cloned inside the workspace: actions/cache can't match
      # `**/` globs outside it, so `../SourcePackagesCache` was never saved.
      - uses: actions/cache@v4
        with:
          path: SourcePackagesCache
          key: ${{ runner.os }}-spm-e2e-pay-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-e2e-pay-

      - name: Build WalletApp for simulator (test mode)
        id: build
        env:
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          TEST_WALLET_PRIVATE_KEY: ${{ steps.wallet.outputs.private-key }}
        run: |
          set -o pipefail && env NSUnbufferedIO=YES \
            xcodebuild \
            -project "Example/ExampleApp.xcodeproj" \
            -scheme "WalletApp" \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath DerivedDataCache \
            -clonedSourcePackagesDirPath SourcePackagesCache \
            RELAY_HOST='relay.walletconnect.com' \
            PROJECT_ID="$PROJECT_ID" \
            TEST_WALLET_PRIVATE_KEY="$TEST_WALLET_PRIVATE_KEY" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) ENABLE_TEST_MODE' \
            build \
            | xcbeautify

      # The merchant inputs enable the expired-payment pool for pay_expired_link:
      # payments only expire 15 min after creation, so each run uses one an
      # earlier run created (kept in actions/cache) and seeds a new one.
      - name: Copy shared Pay test flows
        uses: WalletConnect/actions/maestro/pay-tests@390045a88d335d438c972b422090144158df6823
        with:
          merchant-api-key: ${{ secrets.WPAY_CUSTOMER_KEY_SINGLE_NOKYC }}
          merchant-id: ${{ secrets.WPAY_MERCHANT_ID_SINGLE_NOKYC }}

      - name: Install Maestro
        uses: WalletConnect/actions/maestro/setup@390045a88d335d438c972b422090144158df6823
        with:
          # Multi-device `--shard-split` needs a recent Maestro; pinned so run
          # timings are comparable across runs (react-native-examples uses the same).
          version: '2.10.0'

      - name: Install app on simulators
        run: |
          set -euo pipefail
          APP_PATH=$(find DerivedDataCache -name "WalletApp.app" -path "*/Debug-iphonesimulator/*" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: WalletApp.app not found in DerivedDataCache"
            find DerivedDataCache -name "*.app" -path "*/Debug-iphonesimulator/*"
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "Installing: $APP_PATH"
          IFS=, read -ra IDS <<< "$DEVICE_IDS"
          PIDS=()
          for ID in "${IDS[@]}"; do xcrun simctl install "$ID" "$APP_PATH" & PIDS+=($!); done
          for PID in "${PIDS[@]}"; do wait "$PID"; done

      # With two simulators, one Maestro process splits the flows across them.
      # Only pay_usdt_polygon sends txs from the wallet (Polygon Permit2
      # approve); Base/Optimism payments are gasless EIP-3009 authorizations, so
      # any split is nonce-safe. A failed flow is retried once (only the failed
      # ones; see maestro-suite.sh).
      - name: Run Maestro Pay E2E tests
        id: maestro
        env:
          APP_ID: com.walletconnect.walletapp
          DEEPLINK_PREFIX: 'walletapp://wc?uri='
          WPAY_CUSTOMER_KEY_SINGLE_NOKYC: ${{ secrets.WPAY_CUSTOMER_KEY_SINGLE_NOKYC }}
          WPAY_MERCHANT_ID_SINGLE_NOKYC: ${{ secrets.WPAY_MERCHANT_ID_SINGLE_NOKYC }}
          WPAY_CUSTOMER_KEY_MULTI_NOKYC: ${{ secrets.WPAY_CUSTOMER_KEY_MULTI_NOKYC }}
          WPAY_MERCHANT_ID_MULTI_NOKYC: ${{ secrets.WPAY_MERCHANT_ID_MULTI_NOKYC }}
          WPAY_CUSTOMER_KEY_MULTI_KYC: ${{ secrets.WPAY_CUSTOMER_KEY_MULTI_KYC }}
          WPAY_MERCHANT_ID_MULTI_KYC: ${{ secrets.WPAY_MERCHANT_ID_MULTI_KYC }}
        run: |
          IFS=, read -ra IDS <<< "$DEVICE_IDS"
          mkdir -p "$ARTIFACTS_DIR"
          # App-process-only syslog at the default level (no debug/info), one per
          # simulator (ios-syslog.log is the first). Uploaded only on failure.
          APP_PROCESS=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist" 2>/dev/null || echo WalletApp)
          SYSLOG_PIDS=()
          for i in "${!IDS[@]}"; do
            LOG="$ARTIFACTS_DIR/ios-syslog.log"
            [ "$i" -gt 0 ] && LOG="$ARTIFACTS_DIR/ios-syslog-$((i + 1)).log"
            xcrun simctl spawn "${IDS[$i]}" log stream \
              --style=compact \
              --predicate "process == \"$APP_PROCESS\"" \
              > "$LOG" 2>&1 &
            SYSLOG_PIDS+=($!)
          done
          set +e
          MAESTRO_DEVICES="$DEVICE_IDS" bash .github/scripts/maestro/maestro-suite.sh iOS
          maestro_exit_code=$?
          kill "${SYSLOG_PIDS[@]}" 2>/dev/null || true
          wait "${SYSLOG_PIDS[@]}" 2>/dev/null || true
          mkdir -p "$ARTIFACTS_DIR/ios-crash-reports"
          cp -R "$HOME/Library/Logs/DiagnosticReports/." "$ARTIFACTS_DIR/ios-crash-reports/" 2>/dev/null || true
          exit "$maestro_exit_code"

      # Reset the USDT Permit2 allowance back to 0 so the next pay_usdt_polygon run
      # re-exercises the on-chain `approve` step. Runs even when the suite failed
      # (if: always()) so a mid-flow failure can't leave the allowance set.
      # continue-on-error so a reset hiccup can't fail an otherwise-green run.
      # It signs a transaction, so it's a Node step (not a Maestro runScript); the
      # private key goes via env, never the CLI.
      - name: Reset USDT Permit2 allowance (Polygon)
        if: always() && steps.wallet.outputs.private-key != ''
        continue-on-error: true
        uses: WalletConnect/actions/maestro/permit2-reset@390045a88d335d438c972b422090144158df6823
        with:
          chain-id: eip155:137
          # polygon-rpc.com gates requests (HTTP 401 "tenant disabled") in CI; use publicnode.
          rpc-url: https://polygon-bor-rpc.publicnode.com
          token-address: '0xc2132D05D31c914a87C6611C10748AEb04B58e8F'
          private-key: ${{ steps.wallet.outputs.private-key }}

      # No Maestro --debug-output here: its commands-*.json hold the WPAY_* values.
      - name: Upload debug artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: maestro-pay-test-artifacts
          path: |
            debug-artifacts/**/*.png
            debug-artifacts/**/*.jpg
            debug-artifacts/**/*.jpeg
            debug-artifacts/**/*.mp4
            debug-artifacts/**/*.mov
            debug-artifacts/**/*.webm
            debug-artifacts/**/*.gif
            debug-artifacts/junit-attempt-*.xml
            debug-artifacts/maestro-output.log
            debug-artifacts/ios-crash-reports/**
          retention-days: 14
          if-no-files-found: ignore

      # The app syslog is only useful when something failed.
      - name: Upload iOS syslog (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-pay-ios-syslog
          path: debug-artifacts/ios-syslog*.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Send Slack notification
        if: failure()
        uses: slackapi/slack-github-action@b0fa283ad8fea605de13dc3f449259339835fc52 # v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "E2E Test Report - iOS - Pay",
              "blocks": [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": "🧪 E2E Test Report - iOS (pay)" }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Project:*\n`Reown Swift`" },
                    { "type": "mrkdwn", "text": "*Platform:*\n`iOS`" },
                    { "type": "mrkdwn", "text": "*Branch:*\n`${{ github.ref_name }}`" },
                    { "type": "mrkdwn", "text": "*Trigger:*\n`${{ github.event_name }}`" }
                  ]
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Build:*\n`${{ steps.build.outcome == 'success' && '✅ Success' || '❌ Failed' }}`" },
                    { "type": "mrkdwn", "text": "*Maestro Tests:*\n`${{ steps.maestro.outcome == 'success' && '✅ Passed' || '❌ Failed' }}`" },
                    { "type": "mrkdwn", "text": "*Overall Status:*\n`${{ job.status == 'success' && '✅ Success' || '❌ Failed' }}`" }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "View Workflow Run" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    },
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "Download Artifacts" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts"
                    }
                  ]
                }
              ]
            }
