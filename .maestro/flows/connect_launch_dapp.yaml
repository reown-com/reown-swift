appId: ${APP_ID}
---
# Shared flow: (re)start the Swift sample dApp (Example/DApp) and wait for its
# home screen ("Available Chains" while disconnected, "Session Accounts" once a
# session exists). Same retry as connect_launch_wallet.yaml.
- runFlow: connect_dapp_id.yaml
- retry:
    maxRetries: 3
    commands:
      - stopApp:
          appId: ${output.dappAppId}
      - launchApp:
          appId: ${output.dappAppId}
          permissions:
            all: allow
      - extendedWaitUntil:
          visible: "Available Chains|Session Accounts"
          timeout: 45000
