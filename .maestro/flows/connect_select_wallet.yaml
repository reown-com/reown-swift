appId: ${APP_ID}
---
# Shared flow: from the dApp, open the AppKit modal ("Connect with AppKit") and
# pick "Swift Sample Wallet", a custom wallet in the dApp's AppKit config
# (mobileLink walletapp://), so AppKit hands the pairing URI straight to the
# wallet installed on the simulator. Ends with the session proposal in the
# wallet.

- tapOn:
    id: "connect-button"
# The row is rendered by AppKit, so it can't carry an id; match the name.
- extendedWaitUntil:
    visible: "Swift Sample Wallet.*"
    timeout: 30000

# Done once the wallet shows the session proposal. Each tap waits for the
# modal to settle (connect_settle.yaml), and is repeated only while the row is
# still on screen: a tap that lands moves AppKit to its "connecting" screen.
- retry:
    maxRetries: 3
    commands:
      - runFlow: connect_settle.yaml
      - runFlow:
          when:
            visible: "Swift Sample Wallet.*"
          commands:
            - tapOn: "Swift Sample Wallet.*"
      - runFlow: connect_ios_open_prompt.yaml
      - extendedWaitUntil:
          visible:
            id: "wallet-request-approve"
          timeout: 20000
