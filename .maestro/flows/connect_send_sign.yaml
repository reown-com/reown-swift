appId: ${APP_ID}
---
# Shared flow: from the dApp's "Session Accounts" screen, open an EVM account
# and send personal_sign. The caller then brings the wallet forward
# (connect_wallet_request.yaml).
- tapOn: "eip155:1:0x.*"
- extendedWaitUntil:
    visible:
      id: "sign-message-button"
    timeout: 15000
- tapOn:
    id: "sign-message-button"
