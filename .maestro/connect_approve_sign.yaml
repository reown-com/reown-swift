appId: ${APP_ID}
name: WalletKit Connect - Connect, sign message and disconnect
tags:
  - connect
---
# SLO 2 critical path: dApp → pairing → session proposal → wallet approves →
# session settled → sign request handled.
# Env: APP_ID (wallet), DAPP_APP_ID (dApp).
# Same steps as react-native-examples' and reown-kotlin's
# connect_approve_sign.yaml; only the dApp checks differ (Swift dApp:
# "Session Accounts", "Sign message: success").

- clearState
- runFlow: flows/connect_launch_wallet.yaml
- runFlow: flows/connect_open_dapp.yaml

- startRecording: "Connect - Connect, sign message and disconnect"

# Pairing + session proposal
- runFlow: flows/connect_select_wallet.yaml
- tapOn:
    id: "wallet-request-approve"
- extendedWaitUntil:
    notVisible:
      id: "wallet-request-approve"
    timeout: 30000

# Session settled on the dApp side
- runFlow: flows/connect_back_to_dapp.yaml
- extendedWaitUntil:
    visible: "Session Accounts"
    timeout: 60000

# Sign request (personal_sign)
- runFlow: flows/connect_send_sign.yaml
- runFlow: flows/connect_wallet_request.yaml
- tapOn:
    id: "wallet-request-approve"
- extendedWaitUntil:
    notVisible:
      id: "wallet-request-approve"
    timeout: 30000

- runFlow: flows/connect_back_to_dapp.yaml
- extendedWaitUntil:
    visible: "Sign message: success"
    timeout: 30000

- runFlow: flows/connect_disconnect_dapp.yaml

- stopRecording
